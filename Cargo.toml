[package]
name = "thesilentreach"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "thesilentreach"
path = "src/lib.rs"

[[bin]]
name = "thesilentreach"
path = "gen/bin/desktop.rs"

[dependencies]
bevy = { version = "0.16.1" }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
big_space = "0.10"
bytemuck = "1.16"
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.8"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-lite = "2.3"
dirs = "5.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
